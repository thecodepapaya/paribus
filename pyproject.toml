[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-bulk-api"
version = "0.1.0"
description = "Bulk hospital processing API for the Paribus assignment"
requires-python = ">=3.10"
dependencies = [
    "Flask==3.1.3",
    "pydantic==2.13.5",
    "requests==2.34.2",
    "gunicorn==23.0.0",
]

[tool.setuptools]
packages = ["hospital_bulk"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
